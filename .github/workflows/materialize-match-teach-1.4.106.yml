name: materialize Match teach 1.4.107
on:
  push:
    branches: [fix/match-teach-contrast-1.4.107]
    paths:
      - 'tmp/match-teach-1.4.106.patch.b64.17'
      - '.github/workflows/materialize-match-teach-1.4.106.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/match-teach-contrast-1.4.107
      - name: Apply release changes
        run: python3 -c "from pathlib import Path; p=Path('package.json'); p.write_text(p.read_text().replace('\\\"version\\\": \\\"1.4.106\\\"','\\\"version\\\": \\\"1.4.107\\\"',1)); p=Path('src/config/app.ts'); p.write_text(p.read_text().replace(\"APP_VERSION = '1.4.106'\",\"APP_VERSION = '1.4.107'\",1))"
