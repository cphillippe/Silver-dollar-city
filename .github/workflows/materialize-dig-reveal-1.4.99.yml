name: materialize-dig-reveal-1.4.99
on:
  push:
    branches: [fun/dig-reveal-timed-1.4.99]
  workflow_dispatch:
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fun/dig-reveal-timed-1.4.99
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply remaining Dig Reveal product patch
        run: node scripts/materialize-dig-remaining.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm -f --ignore-unmatch tmp/dig-rem.b64.* tmp/dig-remaining.patch tmp/dig-reveal-1.4.99.patch.b64.* || true
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Dig Reveal timed 1.4.99 — brush dirt before the clock"
            git push
          fi
