name: materialize-dig-reveal-1.4.99
on:
  push:
    branches: [fun/dig-reveal-timed-1.4.99]
  workflow_dispatch:
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fun/dig-reveal-timed-1.4.99
      - name: Assemble and apply Dig Reveal timed patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          parts = sorted(Path('tmp').glob('dig-reveal-1.4.99.patch.p[0-9][0-9]'))
          Path('tmp/dig-reveal-1.4.99.patch').write_text(''.join(p.read_text() for p in parts))
          print('assembled', len(parts), 'parts')
          PY
          git apply --whitespace=nowarn tmp/dig-reveal-1.4.99.patch
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            android/app/build.gradle \
            scripts/check-panel-blast.mjs \
            scripts/check-source-dig.mjs \
            src/components/PuzzlePlay.tsx \
            src/components/challenges/SourceDigPlay.tsx \
            src/content/changelog.ts \
            src/index.css \
            src/lib/easyUi.ts \
            src/lib/sourceDig.ts
          git rm -f --ignore-unmatch tmp/dig-reveal-1.4.99.patch.b64.01 tmp/dig-reveal-1.4.99.patch.b64.02 || true
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Dig Reveal timed 1.4.99 — brush dirt before the clock"
            git push
          fi
