name: City scans

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: city-scans-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  scans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --experimental-strip-types scripts/check-city-scans.mjs
      - run: node --experimental-strip-types scripts/check-phone-fixes.mjs
      - run: node --experimental-strip-types scripts/check-incense-lamps.mjs
      - run: node --experimental-strip-types scripts/check-packs.mjs
      - run: node --experimental-strip-types scripts/check-commerce.mjs
      - run: node scripts/check-play-shop.mjs
      - run: node scripts/check-founders-lamp.mjs
