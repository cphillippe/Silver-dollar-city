name: Patch Match story dock CSS + changelog
on:
  push:
    branches: [fun/match-story-dock-1.4.97]
    paths:
      - scripts/patch-dock-css-cl.mjs
      - .github/workflows/patch-dock-css-cl.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fun/match-story-dock-1.4.97
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch CSS + changelog + checks
        run: node scripts/patch-dock-css-cl.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.css src/content/changelog.ts scripts/check-gem-search.mjs
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Match story dock 1.4.97 — CSS + changelog + check asserts"
            git push
          fi
