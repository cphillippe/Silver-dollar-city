name: Android APK

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "${GITHUB_ENV}"
          export ANDROID_HOME=/usr/local/lib/android/sdk
          sdkmanager="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "${sdkmanager}"
          yes | "${sdkmanager}" --licenses >/tmp/sdk-licenses.txt || true
          "${sdkmanager}" --install "platforms;android-36" "build-tools;35.0.0"

      - run: npm ci

      - name: Build web bundle and sync Android
        run: npm run android:sync

      - name: Write Android SDK path
        run: node scripts/write-android-local-properties.mjs

      - name: Choose signing
        id: sign
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_B64}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD}" ] && [ -n "${ANDROID_KEY_ALIAS}" ] && [ -n "${ANDROID_KEY_PASSWORD}" ]; then
            printf '%s' "${ANDROID_KEYSTORE_B64}" | base64 -d > "${RUNNER_TEMP}/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/release.keystore" >> "${GITHUB_ENV}"
            {
              echo "ANDROID_KEYSTORE_PASSWORD<<EOF"
              echo "${ANDROID_KEYSTORE_PASSWORD}"
              echo "EOF"
              echo "ANDROID_KEY_ALIAS<<EOF"
              echo "${ANDROID_KEY_ALIAS}"
              echo "EOF"
              echo "ANDROID_KEY_PASSWORD<<EOF"
              echo "${ANDROID_KEY_PASSWORD}"
              echo "EOF"
            } >> "${GITHUB_ENV}"
            echo "mode=release" >> "${GITHUB_OUTPUT}"
            echo "Release keystore secrets are present."
          else
            # Fresh key for this job's CI artifact. It is never uploaded to the latest release.
            keytool -genkeypair -v \
              -keystore "${RUNNER_TEMP}/ci-throwaway.keystore" \
              -storepass ci-throwaway \
              -alias ci-throwaway \
              -keypass ci-throwaway \
              -keyalg RSA -keysize 2048 -validity 1 \
              -dname "CN=CI throwaway, OU=Silver City, O=CI, L=CI, ST=CI, C=US"
            echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/ci-throwaway.keystore" >> "${GITHUB_ENV}"
            echo "ANDROID_KEYSTORE_PASSWORD=ci-throwaway" >> "${GITHUB_ENV}"
            echo "ANDROID_KEY_ALIAS=ci-throwaway" >> "${GITHUB_ENV}"
            echo "ANDROID_KEY_PASSWORD=ci-throwaway" >> "${GITHUB_ENV}"
            echo "mode=ci" >> "${GITHUB_OUTPUT}"
            echo "Release secrets are absent. This APK is signed with a throwaway key and must not be published."
          fi

      - name: Assemble release APK
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
          src="app/build/outputs/apk/release/app-release.apk"
          test -f "${src}"
          cp "${src}" "${GITHUB_WORKSPACE}/silver-city.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: silver-city-apk
          path: silver-city.apk
          if-no-files-found: error

      - name: Confirm release secrets before publish
        id: publish_gate
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          SIGN_MODE: ${{ steps.sign.outputs.mode }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "${SIGN_MODE}" != "release" ] || [ -z "${ANDROID_KEYSTORE_B64}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD}" ] || [ -z "${ANDROID_KEY_ALIAS}" ] || [ -z "${ANDROID_KEY_PASSWORD}" ]; then
            echo "Refusing to publish. The latest release accepts only an APK signed with the four repo secrets. No fallback key is uploaded."
            exit 1
          fi
          code=$(node -e "process.stdout.write(String(JSON.parse(require('fs').readFileSync('public/shell.json','utf8')).versionCode))")
          {
            echo "Signing: release (Actions secrets)."
            echo
            echo "Shell versionCode: ${code}"
            echo
            echo "Web content follows GitHub Pages. Reinstall when the app shows Update available."
            echo
            echo "Download: https://github.com/cphillippe/Silver-dollar-city/releases/download/latest/silver-city.apk"
          } > release-notes.md
          echo "ok=true" >> "${GITHUB_OUTPUT}"

      - name: Publish rolling latest release
        if: steps.publish_gate.outputs.ok == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Silver City Android
          make_latest: true
          overwrite_files: true
          body_path: release-notes.md
          files: silver-city.apk
