name: Android APK

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  # A main publish must run to the end. Other refs can cancel.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "${GITHUB_ENV}"
          export ANDROID_HOME=/usr/local/lib/android/sdk
          sdkmanager="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "${sdkmanager}"
          yes | "${sdkmanager}" --licenses >/tmp/sdk-licenses.txt || true
          "${sdkmanager}" --install "platforms;android-36" "build-tools;35.0.0"

      - run: npm ci

      - name: Build web bundle and sync Android
        run: npm run android:sync

      - name: Write Android SDK path
        run: node scripts/write-android-local-properties.mjs

      - name: Assemble a CI APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ci-throwaway.keystore
          ANDROID_KEYSTORE_PASSWORD: ci-throwaway
          ANDROID_KEY_ALIAS: ci-throwaway
          ANDROID_KEY_PASSWORD: ci-throwaway
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "${ANDROID_KEYSTORE_PATH}" \
            -storepass "${ANDROID_KEYSTORE_PASSWORD}" \
            -alias "${ANDROID_KEY_ALIAS}" \
            -keypass "${ANDROID_KEY_PASSWORD}" \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=CI throwaway, OU=Silver City, O=CI, L=CI, ST=CI, C=US"
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
          src="app/build/outputs/apk/release/app-release.apk"
          test -f "${src}"
          cp "${src}" "${GITHUB_WORKSPACE}/silver-city.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: silver-city-apk
          path: silver-city.apk
          if-no-files-found: error

  publish:
    needs: apk
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "${GITHUB_ENV}"
          export ANDROID_HOME=/usr/local/lib/android/sdk
          sdkmanager="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "${sdkmanager}"
          yes | "${sdkmanager}" --licenses >/tmp/sdk-licenses.txt || true
          "${sdkmanager}" --install "platforms;android-36" "build-tools;35.0.0"

      - run: npm ci

      - name: Build web bundle and sync Android
        run: npm run android:sync

      - name: Write Android SDK path
        run: node scripts/write-android-local-properties.mjs

      - name: Assemble the release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_B64}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD}" ] || [ -z "${ANDROID_KEY_ALIAS}" ] || [ -z "${ANDROID_KEY_PASSWORD}" ]; then
            echo "Refusing to publish. The latest release accepts only an APK signed with the four release-environment secrets."
            exit 1
          fi
          printf '%s' "${ANDROID_KEYSTORE_B64}" | base64 -d > "${ANDROID_KEYSTORE_PATH}"
          test -s "${ANDROID_KEYSTORE_PATH}"
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
          src="app/build/outputs/apk/release/app-release.apk"
          test -f "${src}"
          cp "${src}" "${GITHUB_WORKSPACE}/silver-city.apk"
          code=$(node -e "process.stdout.write(String(JSON.parse(require('fs').readFileSync('${GITHUB_WORKSPACE}/public/shell.json','utf8')).versionCode))")
          {
            echo "Signing: release."
            echo
            echo "Shell versionCode: ${code}"
            echo
            echo "Web content follows GitHub Pages. Reinstall when the app shows Update available."
            echo
            echo "Download: https://github.com/cphillippe/Silver-dollar-city/releases/download/latest/silver-city.apk"
          } > "${GITHUB_WORKSPACE}/release-notes.md"

      - name: Point the latest tag at this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete latest --yes --cleanup-tag || true
          git push origin :refs/tags/latest || true
          git tag latest "${GITHUB_SHA}"
          git push origin refs/tags/latest

      - name: Publish rolling latest release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Silver City Android
          make_latest: true
          overwrite_files: true
          body_path: release-notes.md
          files: silver-city.apk
