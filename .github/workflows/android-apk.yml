name: Android APK

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "${GITHUB_ENV}"
          export ANDROID_HOME=/usr/local/lib/android/sdk
          sdkmanager="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "${sdkmanager}"
          yes | "${sdkmanager}" --licenses >/tmp/sdk-licenses.txt || true
          "${sdkmanager}" --install "platforms;android-36" "build-tools;35.0.0"

      - run: npm ci

      - name: Build web bundle and sync Android
        run: npm run android:sync

      - name: Write Android SDK path
        run: node scripts/write-android-local-properties.mjs

      - name: Choose signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD}" ] && [ -n "${ANDROID_KEY_ALIAS}" ] && [ -n "${ANDROID_KEY_PASSWORD}" ]; then
            printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.keystore"
            echo "SIGNING=release" >> "${GITHUB_ENV}"
            echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/release.keystore" >> "${GITHUB_ENV}"
            echo "Release keystore secrets are present. Building a release-signed APK."
          else
            echo "SIGNING=debug" >> "${GITHUB_ENV}"
            echo "Release keystore secrets are absent. Building a debug-signed APK with the committed stable debug key."
          fi

      - name: Assemble APK
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          if [ "${SIGNING}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "${GITHUB_WORKSPACE}/silver-city.apk"
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "${GITHUB_WORKSPACE}/silver-city.apk"
          fi

      - name: Write release notes
        run: |
          set -euo pipefail
          code=$(node -e "process.stdout.write(String(JSON.parse(require('fs').readFileSync('public/shell.json','utf8')).versionCode))")
          {
            if [ "${SIGNING}" = "release" ]; then
              echo "Signing: release (repo secrets)."
            else
              echo "Signing: debug. The APK is debug-signed with the committed stable debug key so it installs over the previous debug build. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD to publish a release signature. The first release-signed APK will not install over this debug build."
            fi
            echo
            echo "Shell versionCode: ${code}"
            echo
            echo "Web content follows GitHub Pages. Reinstall when the app shows Update available."
            echo
            echo "Download: https://github.com/cphillippe/Silver-dollar-city/releases/download/latest/silver-city.apk"
          } > release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: silver-city-apk
          path: silver-city.apk
          if-no-files-found: error

      - name: Publish rolling latest release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Silver City Android
          make_latest: true
          overwrite_files: true
          body_path: release-notes.md
          files: silver-city.apk
