name: Android AAB

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-aab-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  aab:
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "${GITHUB_ENV}"
          export ANDROID_HOME=/usr/local/lib/android/sdk
          sdkmanager="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "${sdkmanager}"
          yes | "${sdkmanager}" --licenses >/tmp/sdk-licenses.txt || true
          "${sdkmanager}" --install "platforms;android-36" "build-tools;35.0.0"

      - run: npm ci

      - name: Build an unsigned Play AAB
        run: bash scripts/ci-play-aab.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: silver-city-aab
          path: silver-city.aab
          if-no-files-found: error

  aab-release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "${GITHUB_ENV}"
          export ANDROID_HOME=/usr/local/lib/android/sdk
          sdkmanager="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "${sdkmanager}"
          yes | "${sdkmanager}" --licenses >/tmp/sdk-licenses.txt || true
          "${sdkmanager}" --install "platforms;android-36" "build-tools;35.0.0"

      - run: npm ci

      - name: Build the Play AAB
        env:
          PLAY_UPLOAD_KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
          PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: bash scripts/ci-play-aab.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: silver-city-aab
          path: silver-city.aab
          if-no-files-found: error
