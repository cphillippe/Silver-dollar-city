name: materialize-dig-reveal-1.4.100
on:
  push:
    branches: [fun/dig-reveal-timed-1.4.100]
  workflow_dispatch:
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fun/dig-reveal-timed-1.4.100
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch changelog 1.4.100 if needed
        run: node scripts/patch-changelog-dig-1.4.100.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/changelog.ts
          git rm -f --ignore-unmatch \
            tmp/dig100p.* tmp/dig100.b64.* tmp/dig-reveal-1.4.100.tgz tmp/dig-rem.b64.* \
            scripts/materialize-dig-reveal-1.4.100.mjs \
            scripts/patch-changelog-dig-1.4.100.mjs \
            .github/workflows/materialize-dig-reveal-1.4.100.yml || true
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Dig Reveal timed 1.4.100 — changelog + cleanup"
            git push
          fi
