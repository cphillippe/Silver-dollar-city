name: materialize-dig-reveal-1.4.100
on:
  push:
    branches: [fun/dig-reveal-timed-1.4.100]
  workflow_dispatch:
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fun/dig-reveal-timed-1.4.100
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Materialize Dig Reveal 1.4.100 product
        run: node scripts/materialize-dig-reveal-1.4.100.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/check-panel-blast.mjs \
            scripts/check-source-dig.mjs \
            src/components/PuzzlePlay.tsx \
            src/components/challenges/SourceDigPlay.tsx \
            src/content/changelog.ts \
            src/lib/easyUi.ts \
            src/lib/sourceDig.ts \
            src/styles/digReveal.css
          git rm -f --ignore-unmatch tmp/dig100.b64.* tmp/dig-reveal-1.4.100.tgz \
            scripts/materialize-dig-reveal-1.4.100.mjs \
            .github/workflows/materialize-dig-reveal-1.4.100.yml || true
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Dig Reveal timed 1.4.100 — brush dirt before the clock"
            git push
          fi
