</div><script>
"use strict";
const MAP=["#########","#H..#..P#","###.#.###","#L..T...#","#######.#","#...#...#","#.#####T#","#S......#","#########"];
const W=9,H=9,DX=[0,1,0,-1],DY=[-1,0,1,0];
const cv=document.getElementById('view'),g=cv.getContext('2d',{willReadFrequently:true}),RW=cv.width,RH=cv.height;
const $=id=>document.getElementById(id);const Q=new URLSearchParams(location.search);
const open=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&MAP[y][x]!=='#';
function find(c){for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(MAP[y][x]===c)return{x,y};}
const START=find('S'),HURT=find('H'),TRAPS=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(MAP[y][x]==='T')TRAPS.push({x,y});

const SECC=[[200,140,60],[200,80,90],[90,110,200],[90,170,90]];
function sec(x,y){if(y>=6&&!(x===7&&y===6))return 0;if(x===7&&y===6)return 1;if(y>=4)return x>=5?1:0;if(y===3)return x>=5?2:3;if(y<=2&&x>=5)return 2;return 3;}

const RSPAWN=[{x:5,y:5},{x:5,y:1},{x:2,y:5}];
let S,AC=null;

function reset(full){const cp=full?null:S.cp;const keep=full?null:S;

 robbers:RSPAWN.map(p=>({sx:p.x,sy:p.y,x:p.x,y:p.y,px:p.x+.5,py:p.y+.5,gone:0})),
 paused:true,inv:0,shake:0,visited:new Set(),sparks:[],t:0,rt:0,done:false,

 if(keep){S.sp=keep.sp;S.lit=keep.lit;S.cp=cp;S.taps=keep.taps;S.gems=keep.gems;S.pops=keep.pops;S.hitsTaken=keep.hitsTaken;S.visited=keep.visited;
  if(cp){S.x=cp.x;S.y=cp.y;S.px=cp.x+.5;S.py=cp.y+.5;S.dir=cp.dir;S.ang=cp.dir*Math.PI/2-Math.PI/2;}}
 S.visited.add(S.x+','+S.y);updHUD();updBtns();}
function trapC(i,t){return(t+i*1.6)%3.2;}
function trapState(i,t){const c=trapC(i,t);return c<1.7?'up':c<2.5?'warn':'down';}
function trapH(i,t){const c=trapC(i,t);if(c<2.5)return 1;const k=(c-2.5)/.7;return k<.2?1-k/.2:k>.8?(k-.8)/.2:0;}

 $('bl').classList.toggle('hide',busy||!canGo(-1));$('bf').classList.toggle('hide',busy||!canGo(0));$('br').classList.toggle('hide',busy||!canGo(1));
 const dead=!busy&&!canGo(-1)&&!canGo(0)&&!canGo(1);$('back').style.display=busy?'none':(dead?'block':'none');}
function bump(){const b=S.hist.pop();if(b){S.tw={k:0,a0:S.ang,a1:S.ang,x0:S.px,y0:S.py,x1:b.x+.5,y1:b.y+.5,dur:.25,nob:1};S.x=b.x;S.y=b.y;}}
function move(r){if(S.tw||S.paused)return;
 if(r===2){S.tw={k:0,a0:S.ang,a1:S.ang+Math.PI,x0:S.px,y0:S.py,x1:S.px,y1:S.py,dur:.35};S.dir=rel(2);updBtns();return;}
 if(!canGo(r))return;const d=rel(r);let nx=S.x+DX[d],ny=S.y+DY[d];const ti=trapAt(nx,ny);
 if(ti>=0){ // must DASH on green, straight through
  if(r!==0){S.tw={k:0,a0:S.ang,a1:S.ang+r*Math.PI/2,x0:S.px,y0:S.py,x1:S.px,y1:S.py,dur:.3};S.dir=d;updBtns();return;}if(!dashGreen(ti)){hit('Wait for green!');return;}
  nx+=DX[d];ny+=DY[d];S.hist.push({x:S.x,y:S.y});S.x=nx;S.y=ny;S.tw={k:0,a0:S.ang,a1:S.ang,x0:S.px,y0:S.py,x1:nx+.5,y1:ny+.5,dur:.45};
  S.visited.add((nx-DX[d])+','+(ny-DY[d]));S.visited.add(nx+','+ny);snd(660,.15,'triangle',.08);updBtns();return;}
 S.hist.push({x:S.x,y:S.y});S.x=nx;S.y=ny;S.dir=d;
 S.tw={k:0,a0:S.ang,a1:S.ang+r*Math.PI/2,x0:S.px,y0:S.py,x1:nx+.5,y1:ny+.5,dur:r?.42:.3};
 S.visited.add(nx+','+ny);snd(140,.06,'triangle',.08);updBtns();}
function burst(x,y,n,col){for(let i=0;i<n;i++)S.sparks.push({x,y,vx:(Math.random()-.5)*170,vy:-Math.random()*150,l:1,c:col||'255,230,120'});}
function arrive(){const c=MAP[S.y][S.x],k=S.x+','+S.y;
 if(S.sp.has(k)){S.sp.delete(k);S.gems++;updHUD();snd(880,.1,'sine',.06);}
 if(c==='P'||c==='L'){S.paused=true;$('laneT').textContent=c==='P'?'The priest passed by.':'The Levite passed by.';
  $('laneP').textContent=c==='P'?'Luke 10:31':'Luke 10:32';$('cLane').style.display='block';updBtns();}
 if(c==='H'){S.paused=true;S.help=0;$('helpB').textContent=HELP[0];$('cHelp').style.display='block';updBtns();}
 checkHit();}
function hit(why){if(S.inv>0||S.paused||Q.has('god'))return;S.hearts--;S.hitsTaken++;updHUD();S.inv=1.5;S.shake=.4;
 $('flash').style.transition='none';$('flash').style.opacity=.5;requestAnimationFrame(()=>{$('flash').style.transition='opacity .45s';$('flash').style.opacity=0;});
 snd(90,.3,'sawtooth',.1);toast(why);if(navigator.vibrate)navigator.vibrate(120);
 S.robbers.forEach(r=>{if(Math.abs(r.x-S.x)+Math.abs(r.y-S.y)<2){r.x=r.sx;r.y=r.sy;r.px=r.x+.5;r.py=r.y+.5;r.gone=3;}});

 if(why!=='Wait for green!')bump();}
function checkHit(){for(const r of S.robbers)if(!r.gone&&r.x===S.x&&r.y===S.y)return hit('Robber! −1 ❤️');}
function toast(m){const t=$('toast');t.textContent=m;t.style.opacity=1;clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity=0,1100);}
function bfs(from){const dist={},q=[from];dist[from.x+','+from.y]=0;while(q.length){const c=q.shift();for(let d=0;d<4;d++){const nx=c.x+DX[d],ny=c.y+DY[d],k=nx+','+ny;const ch=open(nx,ny)?MAP[ny][nx]:'#';if(ch!=='#'&&!'PLH'.includes(ch)&&!(k in dist)){dist[k]=dist[c.x+','+c.y]+1;q.push({x:nx,y:ny});}}}return dist;}
function robberTick(){const dist=bfs({x:S.x,y:S.y});for(const r of S.robbers){if(r.gone)continue;
 const cur=dist[r.x+','+r.y];if(cur===undefined||cur>4)continue;
 let best=null;for(let d=0;d<4;d++){const nx=r.x+DX[d],ny=r.y+DY[d],k=nx+','+ny;if(k in dist&&dist[k]<cur&&trapAt(nx,ny)<0&&!S.robbers.some(o=>o!==r&&!o.gone&&o.x===nx&&o.y===ny))best={x:nx,y:ny};}
 if(best){r.x=best.x;r.y=best.y;}}checkHit();}
function nearest(){const dist=bfs({x:S.x,y:S.y});let m=99;S.robbers.forEach(r=>{if(!r.gone){const v=dist[r.x+','+r.y];if(v!==undefined)m=Math.min(m,v);}});return m;}
function wallCol(u,v,side,dist,s){const row=Math.floor(v*4),off=row%2?.5:0,bu=((u*2+off)%1);const mortar=(v*4%1)<.08||bu<.05;const B=SECC[s];
 const n=(row*37+Math.floor(u*2+off)*53)%30;let r=mortar?B[0]*.35:B[0]*.8+n,gg=mortar?B[1]*.35:B[1]*.8+n*.6,b=mortar?B[2]*.35:B[2]*.8+n*.3;
 if(side){r*=.8;gg*=.8;b*=.8;}const L=Math.min(1,1.6/(dist+.4));return[r*L,gg*L,b*L];}
function mk(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'));return c;}
const SPR={
 robber:mk(64,80,x=>{x.fillStyle='#8a4fc8';x.beginPath();x.moveTo(8,76);x.quadraticCurveTo(2,10,32,6);x.quadraticCurveTo(62,10,56,76);x.closePath();x.fill();
  x.fillStyle='#fff6';for(let i=0;i<9;i++)x.fillRect(10+(i*13)%44,14+(i*17)%56,3,3);
  x.fillStyle='#1a1020';x.fillRect(6,28,52,14);x.fillStyle='#fff';x.beginPath();x.ellipse(22,35,6,5,0,0,7);x.ellipse(42,35,6,5,0,0,7);x.fill();
  x.fillStyle='#111';x.beginPath();x.arc(23,36,2.5,0,7);x.arc(43,36,2.5,0,7);x.fill();x.strokeStyle='#3a1050';x.lineWidth=2.5;x.beginPath();x.arc(32,54,6,.3,2.8);x.stroke();}),
 man:mk(96,48,x=>{x.fillStyle='#8a7a66';x.fillRect(14,24,62,16);x.fillStyle='#e8b98a';x.beginPath();x.arc(82,30,10,0,7);x.fill();x.fillStyle='#222';x.fillRect(80,28,6,2);x.fillStyle='#fff';x.fillRect(38,24,10,8);}),
 block:mk(64,64,x=>{x.fillStyle='#7a6a58';x.fillRect(0,0,64,64);x.fillStyle='#5b4d3f';for(let i=0;i<5;i++)x.fillRect(4+i*12,6+(i%2)*20,8,8);x.strokeStyle='#3a2f25';x.lineWidth=4;x.strokeRect(2,2,60,60);}),
 gem:mk(32,32,x=>{x.fillStyle='#ffe066';x.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,r=i%2?6:15;x.lineTo(16+Math.cos(a)*r,16+Math.sin(a)*r);}x.fill();x.fillStyle='#fff';x.fillRect(13,11,4,4);}),
 lampOff:mk(32,96,x=>{x.fillStyle='#333';x.fillRect(14,20,4,76);x.fillStyle='#555';x.fillRect(6,4,20,18);x.fillStyle='#222';x.fillRect(9,7,14,12);}),
 lampOn:mk(32,96,x=>{x.fillStyle='#333';x.fillRect(14,20,4,76);x.fillStyle='#ffd25a';x.fillRect(6,4,20,18);x.fillStyle='#fff8d0';x.fillRect(9,7,14,12);})
};
function render(dt){const t=S.t;const mv=S.tw&&!S.tw.nob&&(S.tw.x1!==S.tw.x0||S.tw.y1!==S.tw.y0);const bob=mv?Math.sin(S.tw.k*Math.PI*2)*6:0;
 const sh=S.shake>0?(Math.random()-.5)*14*S.shake/.4:0,horizon=RH/2+bob;
 let gr=g.createLinearGradient(0,0,0,horizon);gr.addColorStop(0,'#0b0d24');gr.addColorStop(1,'#3a2a3a');g.fillStyle=gr;g.fillRect(0,0,RW,horizon);
 g.fillStyle='#fff8';for(let i=0;i<25;i++){const sx=((i*97+S.ang*60)%RW+RW)%RW;g.fillRect(sx,(i*53)%(horizon*.7|0),1,1);}
 gr=g.createLinearGradient(0,horizon,0,RH);gr.addColorStop(0,'#2a1c12');gr.addColorStop(1,'#b8864a');g.fillStyle=gr;g.fillRect(0,horizon,RW,RH-horizon);
 const fov=.66,dx=Math.cos(S.ang),dy=Math.sin(S.ang),plx=-dy*fov,ply=dx*fov,Z=new Float32Array(RW);
 const img=g.getImageData(0,0,RW,RH),D=img.data;
 for(let col=0;col<RW;col++){const cam=2*col/RW-1,rx=dx+plx*cam,ry=dy+ply*cam;let mx=Math.floor(S.px),my=Math.floor(S.py),pxc=mx,pyc=my;
  const ddx=Math.abs(1/rx),ddy=Math.abs(1/ry);let sx,sy,sdx,sdy,side=0;
  if(rx<0){sx=-1;sdx=(S.px-mx)*ddx}else{sx=1;sdx=(mx+1-S.px)*ddx}if(ry<0){sy=-1;sdy=(S.py-my)*ddy}else{sy=1;sdy=(my+1-S.py)*ddy}

  const pd=side?sdy-ddy:sdx-ddx;Z[col]=pd;const lh=RH/pd*.9,top=horizon-lh/2;let u=side?S.px+pd*rx:S.py+pd*ry;u-=Math.floor(u);

 g.putImageData(img,0,0);
 gr=g.createRadialGradient(RW/2,RH*.62,20,RW/2,RH*.55,RH*.75);gr.addColorStop(0,'rgba(255,190,90,.18)');gr.addColorStop(.5,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.55)');g.fillStyle=gr;g.fillRect(0,0,RW,RH);
 const sp=[];S.robbers.forEach((r,i)=>{if(!r.gone)sp.push({x:r.px,y:r.py,img:SPR.robber,s:.7,lift:Math.abs(Math.sin(t*6+i))*.06,kind:'robber',ref:r});});
 sp.push({x:HURT.x+.5,y:HURT.y+.5,img:SPR.man,s:.6,lift:0});
 S.sp.forEach(k=>{const[a,b]=k.split(',').map(Number);sp.push({x:a+.5,y:b+.5,img:SPR.gem,s:.22,lift:.3+Math.sin(t*3+a)*.05,kind:'gem',ref:k});});
 LAMPS.forEach((l,i)=>{const on=S.lit.has(i);sp.push({x:l.x+.75,y:l.y+.25,img:on?SPR.lampOn:SPR.lampOff,s:.95,lift:0,kind:on?null:'lamp',ref:i});});
 TRAPS.forEach((tp,i)=>{const st=trapState(i,t),h=trapH(i,t);sp.push({x:tp.x+.5+(st==='warn'?Math.sin(t*60)*.03:0),y:tp.y+.5,img:SPR.block,s:1,lift:h*.75,warn:st==='warn'});});
 sp.forEach(s=>s.d=(s.x-S.px)**2+(s.y-S.py)**2);sp.sort((a,b)=>b.d-a.d);const inv=1/(plx*dy-dx*ply);S.rects=[];
 for(const s of sp){const rx=s.x-S.px,ry=s.y-S.py,tx=inv*(dy*rx-dx*ry),ty=inv*(-ply*rx+plx*ry);if(ty<.15)continue;
  const scx=RW/2*(1+tx/ty),full=RH/ty*.9,hh=full*s.s,ww=hh*s.img.width/s.img.height,top=horizon+full*.5-hh-full*s.lift;
  const x0=scx-ww/2;let vis=0;for(let c=Math.max(0,x0|0);c<Math.min(RW,x0+ww);c++){if(ty>=Z[c])continue;vis++;const srcx=(c-x0)/ww*s.img.width;g.drawImage(s.img,srcx,0,1,s.img.height,c,top,1,hh);}

  if(s.kind&&vis&&ty<4.5)S.rects.push({kind:s.kind,ref:s.ref,x0,y0:top,x1:x0+ww,y1:top+hh,d:ty});
